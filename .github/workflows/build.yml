name: Build
on:
  push:
    branches: [ws5-hyb2]
permissions:
  contents: read
jobs:
  ws5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m venv "$HOME/pio-s3"
          "$HOME/pio-s3/bin/pip" install "platformio==6.1.18" "click<8.2" uv
          export PATH="$HOME/pio-s3/bin:$PATH"
          export PLATFORMIO_CORE_DIR="$HOME/.pio-core-s3"
          pio run -e ws5 -t merge > build.log 2>&1 || { echo "::error title=build::$(grep -E 'error|\*\*\*' build.log | tail -n 15 | tr '\n' '|')"; exit 1; }
          for f in $(find .pio/build/ws5 "$PLATFORMIO_CORE_DIR/packages/framework-arduinoespressif32-libs" -name sdkconfig.h -newer platformio.ini); do echo "::notice title=$f::$(grep -E 'SPIRAM|FLASHMODE|FLASHSIZE "|CACHE_LINE_SIZE |CACHE_SIZE ' $f | sed 's/#define CONFIG_//' | tr '\n' '|')"; done
