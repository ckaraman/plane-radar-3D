# Test branch: build the 5" firmware with the rebuilt (custom sdkconfig) Arduino libs.
name: Build
on:
  push:
    branches: [ws5-hyb]
permissions:
  contents: read
jobs:
  ws5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m venv "$HOME/pio-s3"
          "$HOME/pio-s3/bin/pip" install "platformio==6.1.18" "click<8.2" uv
          export PATH="$HOME/pio-s3/bin:$PATH"
          export PLATFORMIO_CORE_DIR="$HOME/.pio-core-s3"
          set -o pipefail
          if ! "$HOME/pio-s3/bin/pio" run -e ws5 -t merge 2>&1 | tee build.log; then
            msg=$( (grep -n -B3 -A8 "CMake Error\|Error 127\|not found" build.log | grep -v "^[0-9]*-Compiling" | head -n 60; grep -E "error:|\*\*\*" build.log | tail -n 10) | cut -c1-240 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=build tail::$msg"
            exit 1
          fi
          "$HOME/pio-s3/bin/pio" run -e ws5b -t merge > b.log 2>&1 || { echo "::error title=ws5b::$(grep -B12 'collect2' b.log | grep -v '^Compiling\|^Archiving' | cut -c1-400 | tr '\n' '|')"; exit 1; }
          cfg=$(find . "$PLATFORMIO_CORE_DIR" -name sdkconfig.h 2>/dev/null | xargs grep -h -E "DATA_CACHE_LINE_SIZE |SPIRAM_XIP_FROM_PSRAM|TRY_ALLOCATE_WIFI|SPIRAM_SPEED |DATA_CACHE_SIZE |LCD_RGB_ISR_IRAM" 2>/dev/null | sort | uniq -c | tr '\n' '|')
          echo "::notice title=sdkconfig::$cfg"
          echo "::notice title=size::$(grep -E 'RAM:|Flash:' build.log | tr '\n' '|')"
      - uses: actions/upload-artifact@v4
        with:
          name: ws5
          path: .pio/build/ws5/*.bin
