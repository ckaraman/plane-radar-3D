# Test branch: build the 5" firmware with the rebuilt (custom sdkconfig) Arduino libs.
name: Build
on:
  push:
    branches: [ws5-hyb]
permissions:
  contents: read
jobs:
  ws5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m venv "$HOME/pio-s3"
          "$HOME/pio-s3/bin/pip" install "platformio==6.1.18" "click<8.2"
          export PLATFORMIO_CORE_DIR="$HOME/.pio-core-s3"
          set -o pipefail
          if ! "$HOME/pio-s3/bin/pio" run -e ws5 -t merge 2>&1 | tee build.log; then
            msg=$(grep -E "error|\*\*\*|FAILED|undefined reference|fatal" build.log | grep -v "Werror\|-Wno-error" | tail -n 40 | cut -c1-240 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=build tail::$msg"
            exit 1
          fi
          grep -E "DATA_CACHE_LINE_SIZE|SPIRAM_XIP_FROM_PSRAM|TRY_ALLOCATE_WIFI" -r "$PLATFORMIO_CORE_DIR/packages/framework-arduinoespressif32-libs/esp32s3/"*/include/sdkconfig.h | head || true
      - uses: actions/upload-artifact@v4
        with:
          name: ws5
          path: .pio/build/ws5/*.bin
