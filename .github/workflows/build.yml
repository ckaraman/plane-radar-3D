name: Build
on:
  push:
    branches: [ws5-hyb2]
permissions:
  contents: read
jobs:
  ws5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m venv "$HOME/pio-s3"
          "$HOME/pio-s3/bin/pip" install "platformio==6.1.18" "click<8.2" uv
          export PATH="$HOME/pio-s3/bin:$PATH"
          export PLATFORMIO_CORE_DIR="$HOME/.pio-core-s3"
          pio run -e ws5 -t merge > build.log 2>&1 || { echo "::error title=build::$(grep -E 'error|\*\*\*' build.log | tail -n 15 | tr '\n' '|')"; exit 1; }
          cfg=$(grep -h -E "CONFIG_SPIRAM_MODE_|CONFIG_SPIRAM_SPEED |CONFIG_ESPTOOLPY_FLASHMODE|FLASHSIZE \"|DATA_CACHE_LINE_SIZE |XIP_FROM_PSRAM|SPIRAM_BOOT_INIT|TRY_ALLOCATE_WIFI" $(find .pio/build/ws5 -name sdkconfig.h) | sort -u | tr '\n' '|')
          echo "::notice title=sdkconfig::$cfg"
